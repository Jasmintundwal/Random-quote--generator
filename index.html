<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A clean, minimal random quote generator that inspires your day.">
  <title>Random Quote Generator</title>
  
  <!-- Google Fonts: Inter & Lora -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Bar Navigation -->
    <header class="app-header">
      <div class="logo">
        <svg class="logo-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/>
          <path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c1 0 1.25.018 1.25 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/>
        </svg>
        <span class="logo-text">Quote<span class="logo-accent">Pulse</span></span>
      </div>

      <div class="header-actions">
        <!-- Category Filter -->
        <div class="category-select-wrapper">
          <label for="categoryFilter" class="sr-only">Filter by category</label>
          <select id="categoryFilter" aria-label="Filter quote category">
            <option value="all">All Topics</option>
          </select>
        </div>

        <!-- Favorites Drawer Toggle -->
        <button id="favoritesToggleBtn" class="icon-btn" title="View Saved Quotes" aria-label="View Saved Quotes">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          <span id="favoritesBadge" class="badge">0</span>
        </button>

        <!-- Theme Toggle -->
        <button id="themeToggleBtn" class="icon-btn" title="Toggle Light/Dark Theme (T)" aria-label="Toggle theme">
          <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Card Section -->
    <main class="quote-stage">
      <div class="quote-card" id="quoteCard">
        <!-- Watermark Quote Icon -->
        <div class="quote-watermark" aria-hidden="true">“</div>

        <div class="quote-content" id="quoteContent">
          <!-- Tag / Category -->
          <div class="tag-row">
            <span class="category-pill" id="quoteCategory">Inspiration</span>
            <span class="quote-count" id="quoteCounter">Quote</span>
          </div>

          <!-- Main Quote Text -->
          <blockquote class="quote-text" id="quoteText">
            Loading inspiring quote...
          </blockquote>

          <!-- Author Info -->
          <div class="author-wrapper">
            <div class="author-divider"></div>
            <cite class="quote-author" id="quoteAuthor"></cite>
          </div>
        </div>

        <!-- Action Bar -->
        <footer class="card-footer">
          <div class="utility-actions">
            <!-- Copy Quote -->
            <button id="copyBtn" class="action-btn" title="Copy quote to clipboard (C)" aria-label="Copy quote">
              <svg class="copy-default" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <svg class="copy-success" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </button>

            <!-- Text-to-Speech (Listen) -->
            <button id="listenBtn" class="action-btn" title="Listen to quote (L)" aria-label="Listen to quote">
              <svg class="speaker-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              </svg>
              <svg class="stop-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="6" y="6" width="12" height="12"></rect>
              </svg>
            </button>

            <!-- Tweet / Share on X -->
            <button id="shareBtn" class="action-btn" title="Share on X / Twitter" aria-label="Share on X">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
              </svg>
            </button>

            <!-- Save / Favorite -->
            <button id="favoriteBtn" class="action-btn" title="Save to favorites (F)" aria-label="Save to favorites">
              <svg class="heart-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
            </button>
          </div>

          <!-- Primary New Quote Button -->
          <button id="newQuoteBtn" class="primary-btn" title="Show a different quote (Spacebar)">
            <svg class="refresh-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            <span>New Quote</span>
          </button>
        </footer>
      </div>

      <!-- Keyboard shortcuts hint -->
      <div class="shortcuts-hint" aria-hidden="true">
        <span>Press <kbd>Space</kbd> for next quote</span>
        <span class="dot-separator">•</span>
        <span><kbd>C</kbd> to copy</span>
        <span class="dot-separator">•</span>
        <span><kbd>F</kbd> to favorite</span>
      </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="status" aria-live="polite">
      Quote copied to clipboard!
    </div>

    <!-- Favorites Drawer Modal -->
    <div id="favoritesModal" class="modal-overlay" aria-hidden="true">
      <div class="modal-panel" role="dialog" aria-labelledby="favoritesTitle" aria-modal="true">
        <div class="modal-header">
          <h2 id="favoritesTitle" class="modal-title">Saved Quotes</h2>
          <button id="closeModalBtn" class="icon-btn" aria-label="Close favorites">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div id="favoritesList" class="favorites-list">
          <!-- Populated dynamically via JS -->
        </div>

        <div class="modal-footer">
          <button id="clearFavoritesBtn" class="text-danger-btn">Clear All</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="quotes.js"></script>
  <script src="script.js"></script>
</body>
</html>
